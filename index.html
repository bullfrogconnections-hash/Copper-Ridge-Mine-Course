<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copper Ridge Case File — IA Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1c2530;
    --surface: #24303d;
    --surface-raised: #2c3b4a;
    --line: #3b4b5c;
    --copper: #F37135;
    --copper-bright: #FF9558;
    --copper-deep: #C6501A;
    --blue: #73A3CF;
    --blue-deep: #4A7FA8;
    --paper: #eee7d8;
    --paper-dim: #a9b0b8;
    --pass: #6a9b6e;
    --pass-deep: #3f6b45;
    --pass-bg: rgba(106,155,110,0.12);
    --fail: #c1614f;
    --fail-deep: #9c3f30;
    --fail-bg: rgba(193,97,79,0.12);
    --paper-card: #f7f2e8;
    --paper-card-alt: #eee7d5;
    --line-light: #dcd3bd;
    --ink: #2b2820;
    --ink-soft: #453f30;
    --ink-dim: #756c54;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:280px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--line);
    padding:28px 0;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{
    padding:0 22px 22px;
    border-bottom:1px solid var(--line);
    margin-bottom:8px;
  }
  .brand .eyebrow{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--copper-bright); margin-bottom:6px;
  }
  .brand h1{
    font-family:'Oswald',sans-serif; font-size:20px; font-weight:600; text-transform:uppercase; letter-spacing:.02em;
    margin:0; line-height:1.25; color:var(--paper);
  }
  .brand .sub{font-size:12px; color:var(--paper-dim); margin-top:6px;}

  .nav-item{
    display:flex; align-items:flex-start; gap:12px;
    padding:13px 22px; cursor:pointer;
    border-left:3px solid transparent;
    transition:background .15s ease, border-color .15s ease;
  }
  .nav-item:hover{background:var(--surface-raised);}
  .nav-item.active{
    background:var(--surface-raised);
    border-left-color:var(--copper);
  }
  .nav-num{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:11px;
    color:var(--copper-bright); padding-top:2px; flex-shrink:0; width:16px;
  }
  .nav-label{font-size:13.5px; line-height:1.4; color:var(--paper);}
  .nav-item.active .nav-label{color:var(--copper-bright); font-weight:600;}
  .nav-stage{font-size:11px; color:var(--paper-dim); margin-top:2px;}
  .nav-status{
    margin-left:auto; font-size:14px; flex-shrink:0; padding-top:1px;
  }
  .final-item{
    margin-top:8px; border-top:1px solid var(--line); padding-top:16px;
  }
  .resource-links{
    margin-top:20px; padding:16px 22px; border-top:1px solid var(--line);
  }
  .resource-links-label{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    font-size:9.5px; color:var(--paper-dim); margin-bottom:10px;
  }
  .resource-link{
    display:block; font-size:12.5px; color:var(--blue); text-decoration:none;
    padding:6px 0; border-bottom:1px solid transparent; line-height:1.4;
  }
  .resource-link:hover{color:var(--copper-bright); text-decoration:underline;}

  /* Main */
  .main{
    flex:0 1 820px; padding:44px 56px;
    background:var(--paper-card);
    min-height:100vh;
    box-shadow: -1px 0 0 var(--line) inset;
  }
  .vocab-inline-wrap{
    display:flex; flex-wrap:wrap; gap:12px; margin:10px 0 20px;
  }
  .vocab-bubble-inline{
    background:var(--paper-card-alt); border:1px solid var(--blue); border-radius:12px;
    padding:12px 16px; max-width:260px; flex:1 1 220px;
  }
  .vocab-bubble-inline .term{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:15.5px; color:var(--blue-deep); margin-bottom:4px; text-transform:uppercase; letter-spacing:.02em;
  }
  .vocab-bubble-inline .def{font-size:13px; line-height:1.5; color:var(--ink-soft);}

  .vocab-rail{
    flex:1; min-width:0; padding:44px 20px; display:none;
  }
  @media(min-width:1180px){
    .vocab-rail{display:block;}
  }
  .vocab-rail-inner{position:sticky; top:44px;}
  .vocab-rail-label{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--paper-dim); margin-bottom:16px; padding-left:4px;
  }
  .vocab-bubble{
    background:var(--surface-raised); border:1px solid var(--blue); border-radius:14px;
    padding:14px 16px; margin-bottom:14px; max-width:210px;
  }
  .vocab-bubble .term{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:15.5px; color:var(--blue); margin-bottom:5px; text-transform:uppercase; letter-spacing:.02em;
  }
  .vocab-bubble .def{font-size:12.5px; line-height:1.5; color:var(--paper);}

  .page-nav{
    display:flex; align-items:center; justify-content:space-between; margin-top:24px;
    padding-top:16px; border-top:1px solid var(--line-light);
  }
  .page-dots{display:flex; gap:6px;}
  .page-dot{width:7px; height:7px; border-radius:50%; background:var(--line-light); cursor:pointer;}
  .page-dot.active{background:var(--copper-deep); width:20px; border-radius:4px;}
  .page-btn{
    background:none; border:1px solid var(--line-light); color:var(--copper-deep);
    border-radius:5px; font-size:13px; padding:8px 16px; cursor:pointer; font-family:'Inter',sans-serif; font-weight:600;
  }
  .page-btn:hover{background:rgba(148,85,31,0.06);}
  .page-btn:disabled{opacity:.3; cursor:not-allowed;}
  .page-title{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-dim); margin-bottom:12px;
  }
  .stage-tag{
    display:inline-block; font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--copper-deep); background:rgba(148,85,31,0.09);
    border:1px solid rgba(148,85,31,0.3); border-radius:3px;
    padding:4px 9px; margin-bottom:14px;
  }
  h2.module-title{
    font-family:'Oswald',sans-serif; font-size:34px; font-weight:600; text-transform:uppercase; letter-spacing:.01em;
    margin:0 0 6px; color:var(--ink); line-height:1.2;
  }
  .module-stage-line{
    font-size:14.5px; color:var(--ink-dim); font-style:italic; margin-bottom:20px;
  }
  .tab-continue-row{
    display:flex; justify-content:flex-end; margin-top:20px; padding-top:16px; border-top:1px solid var(--line-light);
  }
  .continue-btn{
    background:var(--copper); color:#fff; border:none; border-radius:5px;
    font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px; letter-spacing:.02em;
    padding:11px 20px; cursor:pointer; transition:background .15s ease;
  }
  .continue-btn:hover{background:var(--copper-deep);}

  .fppl-badge{
    display:inline-block; background:rgba(106,155,110,0.08); border:1px solid var(--pass-deep); border-radius:20px;
    padding:6px 14px; margin:4px 0 20px; font-size:12px; color:var(--ink-dim); line-height:1.4;
  }
  .fppl-label{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:9px;
    color:var(--pass-deep); margin-right:6px;
  }

  .tabs{display:flex; gap:2px; margin-bottom:28px; border-bottom:1px solid var(--line-light);}
  .tab{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:11.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-dim); background:none; border:none;
    padding:11px 4px; margin-right:26px; cursor:pointer; border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--copper-deep); border-bottom-color:var(--copper);}
  .tab-utility{
    margin-left:auto; margin-right:0; color:var(--blue-deep); border-bottom-color:transparent;
  }
  .tab-utility:first-of-type{ margin-left:auto; }
  .tab-utility ~ .tab-utility{ margin-left:0; }
  .tab-utility:hover{color:var(--blue); border-bottom-color:var(--blue);}

  .panel{display:none;}
  .panel.active{display:block; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .content-text p{font-size:15.5px; line-height:1.75; color:var(--ink-soft); margin:0 0 16px;}
  .content-text strong{color:var(--ink);}

  .example-box{
    background:rgba(148,85,31,0.06); border-left:3px solid var(--copper-deep);
    border-radius:4px; padding:14px 18px; margin:6px 0 24px;
  }
  .example-box .label{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--copper-deep); margin-bottom:6px;
  }
  .example-box p{font-size:14.5px; line-height:1.65; color:var(--ink-soft); margin:0;}

  .diagram-box{
    background:var(--paper-card-alt); border:1px solid var(--line-light); border-radius:6px;
    padding:20px; margin:0 0 24px; text-align:center;
  }
  .diagram-box svg{max-width:100%; height:auto;}
  .diagram-caption{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:10.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-dim); margin-top:10px;
  }

  .model-toggle{
    margin-bottom:14px; background:none; border:1px solid var(--copper); color:var(--copper-deep);
    border-radius:5px; font-size:13px; padding:9px 16px; cursor:pointer; font-family:'Inter',sans-serif; font-weight:600;
  }
  .model-toggle:hover{background:rgba(148,85,31,0.06);}
  .model-panel{
    margin-bottom:16px; background:rgba(193,122,63,0.07); border:1px solid var(--copper);
    border-radius:6px; padding:16px 20px;
  }
  .model-panel .label{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--copper-deep); margin-bottom:8px;
  }
  .model-panel p{font-size:14px; line-height:1.7; color:var(--ink-soft); margin:0; font-style:italic;}

  .compare-table{
    display:flex; gap:16px; margin:14px 0 20px; flex-wrap:wrap;
  }
  .compare-col{
    flex:1 1 220px; background:var(--paper-card-alt); border:1px solid var(--line-light);
    border-radius:6px; padding:16px 18px;
  }
  .compare-head{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; text-transform:uppercase;
    letter-spacing:.02em; color:var(--copper-deep); margin-bottom:10px;
  }
  .compare-col ul{margin:0; padding-left:18px; color:var(--ink-soft); font-size:13.5px; line-height:1.7;}

  .stage-qa-box{
    background:var(--paper-card-alt); border:1px solid var(--line-light); border-radius:6px;
    padding:20px 24px; margin:0 0 24px;
  }
  .stage-qa-box .label{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:10.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--copper-deep); margin-bottom:14px;
  }
  .stage-qa-item{margin-bottom:16px;}
  .stage-qa-item:last-child{margin-bottom:0;}
  .stage-qa-q{
    font-size:14.5px; font-weight:600; color:var(--ink); margin-bottom:6px; line-height:1.5;
  }
  .stage-qa-a{
    font-size:14px; color:var(--ink-soft); line-height:1.6; padding-left:14px;
    border-left:2px solid var(--copper);
  }

  .template-intro{
    font-size:14.5px; line-height:1.7; color:var(--ink-soft); margin-bottom:24px;
  }
  .template-section{
    margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid var(--line-light);
  }
  .template-section:last-child{border-bottom:none;}
  .template-section h3{
    font-family:'Oswald',sans-serif; font-size:18px; font-weight:600; color:var(--copper-deep); margin:0 0 10px; text-transform:uppercase; letter-spacing:.02em;
  }
  .template-section ul{margin:0 0 10px 18px; padding:0; color:var(--ink-dim); font-size:13.5px; line-height:1.8;}
  .template-textarea{
    width:100%; min-height:90px; background:#fffdf7; border:1px solid var(--line-light);
    border-radius:5px; color:var(--ink); font-family:'Inter',sans-serif; font-size:14px; padding:12px 14px; resize:vertical;
  }
  .template-textarea:focus{outline:none; border-color:var(--copper-deep);}

  .next-steps-note{
    margin-top:8px; padding:16px 20px; background:rgba(148,85,31,0.06);
    border:1px dashed var(--copper); border-radius:6px;
    font-size:14px; color:var(--ink-soft); line-height:1.6; text-align:center;
  }
  .next-steps-note strong{color:var(--copper-deep);}

  .selfcheck-toggle{
    margin-top:14px; background:none; border:1px solid var(--line-light); color:var(--copper-deep);
    border-radius:5px; font-size:13px; padding:9px 16px; cursor:pointer; font-family:'Inter',sans-serif; font-weight:600;
  }
  .selfcheck-toggle:hover{background:rgba(148,85,31,0.06);}
  .selfcheck-panel{
    margin-top:14px; background:rgba(106,155,110,0.07); border:1px solid var(--pass-deep);
    border-radius:6px; padding:16px 20px;
  }
  .selfcheck-panel .label{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--pass-deep); margin-bottom:8px;
  }
  .selfcheck-panel .disclaimer{font-size:12px; color:var(--ink-dim); margin-bottom:10px; font-style:italic;}
  .selfcheck-panel ul{margin:0 0 0 18px; padding:0; color:var(--ink-soft); font-size:14px; line-height:1.75;}

  .assignment-box{
    background:var(--paper-card-alt); border:1px solid var(--line-light); border-radius:6px;
    padding:22px 24px; margin-top:6px;
  }
  .assignment-box .label{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:10.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--copper-deep); margin-bottom:10px;
  }
  .assignment-box p{font-size:15px; line-height:1.7; color:var(--ink-soft); margin:0 0 12px;}
  .assignment-box ul{margin:0 0 0 18px; padding:0; color:var(--ink-soft); font-size:14.5px; line-height:1.8;}
  textarea.log{
    width:100%; min-height:120px; margin-top:14px; background:#fffdf7;
    border:1px solid var(--line-light); border-radius:5px; color:var(--ink);
    font-family:'Inter',sans-serif; font-size:14px; padding:12px 14px; resize:vertical;
  }
  textarea.log:focus{outline:none; border-color:var(--copper-deep);}
  .log-hint{font-size:11.5px; color:var(--ink-dim); margin-top:8px;}

  .quiz-q{
    background:var(--paper-card-alt); border:1px solid var(--line-light); border-radius:6px;
    padding:20px 22px; margin-bottom:14px;
  }
  .quiz-q .qnum{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:11px; color:var(--copper-deep); margin-bottom:8px;
  }
  .quiz-q .qtext{font-size:15px; color:var(--ink); margin-bottom:14px; line-height:1.5;}
  .option{
    display:flex; align-items:flex-start; gap:10px; padding:9px 10px;
    border-radius:4px; cursor:pointer; margin-bottom:2px; transition:background .12s ease;
  }
  .option:hover{background:rgba(43,40,32,0.05);}
  .option input{margin-top:3px; accent-color:var(--copper-deep);}
  .option label{font-size:14px; color:var(--ink-soft); cursor:pointer; line-height:1.5;}

  .quiz-actions{display:flex; align-items:center; gap:16px; margin-top:20px;}
  button.primary{
    background:var(--copper); color:#1b211d; border:none; border-radius:5px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    padding:11px 22px; cursor:pointer; transition:background .15s ease;
  }
  button.primary:hover{background:var(--copper-bright);}
  button.ghost{
    background:none; border:1px solid var(--line-light); color:var(--ink-dim);
    border-radius:5px; font-size:13.5px; padding:10px 18px; cursor:pointer;
  }
  button.ghost:hover{border-color:var(--copper-deep); color:var(--copper-deep);}

  .result-banner{
    margin-top:22px; padding:20px 24px; border-radius:6px; border:1px solid;
    display:flex; align-items:center; gap:18px;
  }
  .result-banner.pass{background:var(--pass-bg); border-color:var(--pass-deep);}
  .result-banner.fail{background:var(--fail-bg); border-color:var(--fail-deep);}
  .stamp{
    font-family:'Inter',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-weight:700; font-size:13px;
    letter-spacing:.08em; padding:8px 14px; border-radius:4px; border:2px solid;
    transform:rotate(-4deg); flex-shrink:0;
  }
  .stamp.pass{color:var(--pass-deep); border-color:var(--pass-deep);}
  .stamp.fail{color:var(--fail-deep); border-color:var(--fail-deep);}
  .result-text .score{font-size:15px; font-weight:600; margin-bottom:2px; color:var(--ink);}
  .result-text .detail{font-size:13px; color:var(--ink-dim);}

  .progress-strip{
    display:flex; gap:4px; margin-bottom:10px;
  }
  .progress-dot{
    flex:1; height:4px; border-radius:2px; background:var(--line-light);
  }
  .progress-dot.done{background:var(--pass-deep);}
  .progress-dot.failed{background:var(--fail-deep);}

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}

  @media(max-width:820px){
    .app{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative;}
    .main{padding:28px 20px;}
  }

  .gate-overlay{
    position:fixed; inset:0; z-index:1000; background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .gate-card{
    max-width:420px; width:100%; background:var(--paper-card); border-radius:10px;
    padding:40px 36px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .gate-card h1{
    font-family:'Oswald',sans-serif; font-size:24px; font-weight:700; text-transform:uppercase;
    color:var(--ink); margin:0 0 8px;
  }
  .gate-card .sub{font-size:13px; color:var(--ink-dim); margin-bottom:24px;}
  .gate-card input{
    width:100%; padding:13px 16px; border:1px solid var(--line-light); border-radius:6px;
    background:#fffdf7; color:var(--ink); font-family:'Inter',sans-serif; font-size:16px;
    text-align:center; letter-spacing:.05em; margin-bottom:14px;
  }
  .gate-card input:focus{outline:none; border-color:var(--copper);}
  .gate-card button{
    width:100%; background:var(--copper); color:#fff; border:none; border-radius:6px;
    font-family:'Inter',sans-serif; font-weight:700; font-size:14px; padding:13px; cursor:pointer;
  }
  .gate-card button:hover{background:var(--copper-deep);}
  .gate-error{color:var(--fail-deep); font-size:13px; margin-top:10px; min-height:16px;}
  .gate-footer{font-size:11px; color:var(--ink-dim); margin-top:20px;}
</style>
</head>
<body>
<div id="gateOverlay" class="gate-overlay">
  <div class="gate-card">
    <h1>Copper Ridge Project</h1>
    <div class="sub">This course is for FNMPC members and invited participants. Enter your access code to continue.</div>
    <input type="password" id="gateInput" placeholder="Access code" autocomplete="off">
    <button onclick="checkGateCode()">Enter Course</button>
    <div class="gate-error" id="gateError"></div>
    <div class="gate-footer">Don't have a code? Contact FNMPC's Environmental Services team.</div>
  </div>
</div>
<div class="app" id="appRoot" style="display:none;">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
  <aside class="vocab-rail" id="vocabRail"></aside>
</div>

<script>

function downloadCertificate(){
  const nameInput = document.getElementById('certName');
  const name = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : 'Course Participant';

  const canvas = document.createElement('canvas');
  canvas.width = 1600;
  canvas.height = 1131;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#f7f1e1';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Outer border
  ctx.strokeStyle = '#94551f';
  ctx.lineWidth = 6;
  ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

  // Inner border
  ctx.strokeStyle = '#c17a3f';
  ctx.lineWidth = 2;
  ctx.strokeRect(64, 64, canvas.width - 128, canvas.height - 128);

  ctx.textAlign = 'center';

  // Eyebrow
  ctx.fillStyle = '#94551f';
  ctx.font = '600 22px "Inter", sans-serif';
  ctx.fillText('COPPER RIDGE PROJECT  ·  IMPACT ASSESSMENT COURSE', canvas.width/2, 175);

  // Title
  ctx.fillStyle = '#2b2820';
  ctx.font = '700 58px "Oswald", sans-serif';
  ctx.fillText('Certificate of Completion', canvas.width/2, 270);

  // Subtitle
  ctx.fillStyle = '#453f30';
  ctx.font = 'italic 26px "Inter", sans-serif';
  ctx.fillText('This certifies that', canvas.width/2, 400);

  // Name
  ctx.fillStyle = '#94551f';
  ctx.font = '700 52px "Oswald", sans-serif';
  ctx.fillText(name, canvas.width/2, 480);

  // Underline beneath name
  const nameWidth = ctx.measureText(name).width;
  ctx.strokeStyle = '#c17a3f';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(canvas.width/2 - Math.max(nameWidth/2, 220), 510);
  ctx.lineTo(canvas.width/2 + Math.max(nameWidth/2, 220), 510);
  ctx.stroke();

  // Body text
  ctx.fillStyle = '#453f30';
  ctx.font = '24px "Inter", sans-serif';
  ctx.fillText('has successfully completed the Copper Ridge Project Impact Assessment Case Study,', canvas.width/2, 580);
  ctx.fillText('covering all seven modules and the Final Certification exam', canvas.width/2, 615);
  ctx.fillText('at 80% or higher, from introduction through cultural rights assessment.', canvas.width/2, 650);

  // Date
  const dateStr = new Date().toLocaleDateString('en-CA', { year:'numeric', month:'long', day:'numeric' });
  ctx.fillStyle = '#6b6350';
  ctx.font = '20px "Inter", sans-serif';
  ctx.fillText('Date completed: ' + dateStr, canvas.width/2, 740);

  // Stamp-style seal
  ctx.save();
  ctx.translate(canvas.width/2, 870);
  ctx.rotate(-0.08);
  ctx.strokeStyle = '#3f6b45';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, 70, 0, Math.PI*2);
  ctx.stroke();
  ctx.fillStyle = '#3f6b45';
  ctx.font = '700 20px "Inter", sans-serif';
  ctx.fillText('PASSED', 0, -4);
  ctx.font = '600 13px "Inter", sans-serif';
  ctx.fillText('80%+', 0, 18);
  ctx.restore();

  // Footer
  ctx.fillStyle = '#6b6350';
  ctx.font = '16px "Inter", sans-serif';
  ctx.fillText('Tsilaqw Nation · Copper Ridge Project Case Study · First Nations Major Projects Coalition', canvas.width/2, canvas.height - 90);

  canvas.toBlob(function(blob){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const safeName = name.replace(/[^a-z0-9]+/gi, '_');
    a.download = 'Certificate_of_Completion_' + safeName + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 'image/png');
}

function downloadCaseFileTemplate(){

  URL.revokeObjectURL(url);

function flowDiagram(steps){
  const boxW = 168, boxH = 64, gap = 44, top = 12;
  const totalW = steps.length*boxW + (steps.length-1)*gap;
  const totalH = boxH + top*2;
  let svg = `<svg viewBox="0 0 ${totalW} ${totalH}" xmlns="http://www.w3.org/2000/svg" role="img">
    <title>${steps.join(' \u2192 ')}</title>`;
  steps.forEach((label, i) => {
    const x = i*(boxW+gap);
    svg += `
      <rect x="${x}" y="${top}" width="${boxW}" height="${boxH}" rx="8" fill="var(--paper-card)" stroke="var(--copper-deep)" stroke-width="1.5"/>
      <foreignObject x="${x+8}" y="${top}" width="${boxW-16}" height="${boxH}">
        <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,sans-serif;font-size:12.5px;color:var(--ink);line-height:1.3;padding:4px;box-sizing:border-box;">${label}</div>
      </foreignObject>`;
    if(i < steps.length-1){
      const ax = x+boxW;
      const midY = top + boxH/2;
      svg += `
        <line x1="${ax+4}" y1="${midY}" x2="${ax+gap-10}" y2="${midY}" stroke="var(--copper-deep)" stroke-width="2"/>
        <polygon points="${ax+gap-10},${midY-6} ${ax+gap-2},${midY} ${ax+gap-10},${midY+6}" fill="var(--copper-deep)"/>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

    return `<button class="continue-btn" onclick="selectTab('${nextTab}')">Continue to ${tabDisplayNames[nextTab]} &rarr;</button>`;

  if(m.pages){

    </div>

  const assignmentTabHtml = isFinal ? '' : `<button class="tab ${state.activeTab==='assignment'?'active':''}" onclick="selectTab('assignment')">Review</button>`;
  const assignmentPanelHtml = isFinal ? '' : `
    <div class="panel ${state.activeTab==='assignment'?'active':''}">

        ${m.assignment.modelResponse ? `

        ${state.modelRevealed[m.id] ? `
        <div class="model-panel">
          <div class="label">Example Response</div>
          <p>${m.assignment.modelResponse}</p>
        </div>` : ''}` : ''}
        <textarea class="log" id="review-ta-${m.id}" oninput="saveReviewAnswer(${idLiteral}, this.value)" placeholder="Write your case file entry here...">${escapeHtml(state.reviewAnswers[m.id] || '')}</textarea>
        <div class="log-hint">${m.assignment.hint}</div>
        ${m.assignment.selfCheck ? `
        <button class="selfcheck-toggle" onclick="toggleSelfCheck(${idLiteral})">${state.selfCheckRevealed[m.id] ? 'Hide Self-Check Guidance' : 'Submit for Self-Check'}</button>

        <div class="selfcheck-panel">

      <div class="tab-continue-row">${continueButton('assignment')}</div>

  const templateTabHtml = (m.id === 7) ? `<button class="tab ${state.activeTab==='template'?'active':''}" onclick="selectTab('template')">Case File Template</button>` : '';

      <div class="assignment-box">
        <div class="label">Complete Case File Template</div>

        ${CASE_FILE_TEMPLATE.map((section,i) => `

function setFeedbackAnswer(qid, val){
  state.feedbackAnswers[qid] = val;
  render();
}

function submitFeedback(){
  const suggestions = document.getElementById('feedbackSuggestions');
  if(suggestions) state.feedbackSuggestions = suggestions.value;
  const comment = document.getElementById('feedbackComment');
  if(comment) state.feedbackComment = comment.value;
  state.feedbackSubmitted = true;
  render();
}

function feedbackAsText(){
  let text = "COPPER RIDGE COURSE — LEARNER FEEDBACK\n";
  text += "=".repeat(45) + "\n\n";
  FEEDBACK_QUESTIONS.forEach(q => {
    const val = state.feedbackAnswers[q.id];
    text += q.label + "\n";
    text += "Rating: " + (val ? val + " / 5" : "(not answered)") + "\n\n";
  });
  text += "Suggestions to make this course better:\n" + (state.feedbackSuggestions || "(none)") + "\n\n";
  text += "Additional comments:\n" + (state.feedbackComment || "(none)") + "\n";
  return text;
}

function downloadFeedback(){
  const blob = new Blob([feedbackAsText()], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "Copper_Ridge_Course_Feedback.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function emailFeedback(){
  const subject = encodeURIComponent("Copper Ridge Course — Learner Feedback");
  const body = encodeURIComponent(feedbackAsText());
  window.location.href = `mailto:fchitty@fnmpc.ca?subject=${subject}&body=${body}`;
}

function renderDashboardView(){
  document.getElementById('vocabRail').innerHTML = '';
  const rows = MODULES.map(m => {
    const qs = state.quizState[m.id];
    const pct = qs.submitted ? Math.round((qs.score/qs.total)*100) : null;
    const status = !qs.submitted ? 'Not attempted' : (pct >= 80 ? 'Passed' : 'Not yet passed');
    const statusColor = !qs.submitted ? 'var(--ink-dim)' : (pct >= 80 ? 'var(--pass-deep)' : 'var(--fail-deep)');
    return { label:`Module ${String(m.id).padStart(2,'0')} — ${m.title}`, pct, status, statusColor };
  });
  const fqs = state.quizState[FINAL_EXAM.id];
  const fpct = fqs.submitted ? Math.round((fqs.score/fqs.total)*100) : null;
  rows.push({
    label: "Final Certification",
    pct: fpct,
    status: !fqs.submitted ? 'Not attempted' : (fpct >= 80 ? 'Passed' : 'Not yet passed'),
    statusColor: !fqs.submitted ? 'var(--ink-dim)' : (fpct >= 80 ? 'var(--pass-deep)' : 'var(--fail-deep)'),
  });
  const attempted = rows.filter(r => r.pct !== null);
  const avgScore = attempted.length ? Math.round(attempted.reduce((s,r)=>s+r.pct,0)/attempted.length) : null;
  const passCount = rows.filter(r => r.status === 'Passed').length;

  let html = `
    <div class="stage-tag">Facilitator Dashboard</div>
    <h2 class="module-title">Progress on This Device</h2>
    <div class="module-stage-line">This shows only what's happened in this browser during this session — not a live, multi-learner view. Centralized analytics across every participant would use the AWS backend described alongside this course.</div>
    <div class="assignment-box">
      <div style="display:flex; gap:20px; margin-bottom:24px; flex-wrap:wrap;">
        <div style="flex:1; min-width:140px; text-align:center; padding:16px; background:var(--paper-card-alt); border-radius:8px;">
          <div style="font-family:'Oswald',sans-serif; font-size:28px; font-weight:700; color:var(--copper-deep);">${passCount} / ${rows.length}</div>
          <div style="font-size:12px; color:var(--ink-dim);">Modules Passed</div>
        </div>
        <div style="flex:1; min-width:140px; text-align:center; padding:16px; background:var(--paper-card-alt); border-radius:8px;">
          <div style="font-family:'Oswald',sans-serif; font-size:28px; font-weight:700; color:var(--copper-deep);">${avgScore !== null ? avgScore + '%' : '—'}</div>
          <div style="font-size:12px; color:var(--ink-dim);">Average Score (attempted)</div>
        </div>
      </div>
      <table style="width:100%; border-collapse:collapse;">
        <tr style="background:var(--copper); color:#fff;">
          <th style="text-align:left; padding:10px 12px; font-size:13px;">Module</th>
          <th style="text-align:center; padding:10px 12px; font-size:13px;">Score</th>
          <th style="text-align:center; padding:10px 12px; font-size:13px;">Status</th>
        </tr>
        ${rows.map((r,i) => `
          <tr style="background:${i%2===0 ? 'var(--paper-card-alt)' : 'transparent'};">
            <td style="padding:10px 12px; font-size:14px; color:var(--ink); border-bottom:1px solid var(--line-light);">${r.label}</td>
            <td style="padding:10px 12px; font-size:14px; text-align:center; border-bottom:1px solid var(--line-light);">${r.pct !== null ? r.pct + '%' : '—'}</td>
            <td style="padding:10px 12px; font-size:13px; text-align:center; font-weight:600; color:${r.statusColor}; border-bottom:1px solid var(--line-light);">${r.status}</td>
          </tr>
        `).join('')}
      </table>
    </div>
  `;
  document.getElementById('main').innerHTML = html;
}

function downloadEverything(){
  let text = "COPPER RIDGE COURSE — MY COMPLETE TAKEAWAY\n";
  text += "Tsilaqw Nation Impact Assessment Case Study\n";
  text += "=".repeat(50) + "\n\n";

  text += "PART 1: MODULE CASE FILE ENTRIES\n";
  text += "-".repeat(35) + "\n\n";
  MODULES.forEach(m => {
    text += `Module ${String(m.id).padStart(2,'0')} — ${m.title}\n`;
    const answer = (state.reviewAnswers[m.id] || '').trim();
    text += (answer || "(not started yet)") + "\n\n";
  });

  text += "\nPART 2: COMPLETE CASE FILE TEMPLATE\n";
  text += "-".repeat(35) + "\n\n";
  CASE_FILE_TEMPLATE.forEach((section, i) => {
    text += section.heading + "\n";
    section.prompts.forEach(p => { text += "  • " + p + "\n"; });
    const notes = (state.templateAnswers[i] && state.templateAnswers[i].trim()) ? state.templateAnswers[i].trim() : "(no notes yet)";
    text += "Notes: " + notes + "\n\n";
  });

  const fqs = state.quizState[FINAL_EXAM.id];
  const fPassed = fqs.submitted && (fqs.score/fqs.total) >= PASS_THRESHOLD;
  text += "\nPART 3: CERTIFICATE\n";
  text += "-".repeat(20) + "\n";
  text += fPassed
    ? "You've passed the Final Certification exam. Download your certificate separately from the Final Certification page.\n"
    : "Not yet earned — pass the Final Certification exam at 80% or higher to unlock your certificate.\n";

  const blob = new Blob([text], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "Copper_Ridge_Course_Complete_Takeaway.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  rail.innerHTML = `
    <div class="vocab-rail-inner">
      <div class="vocab-rail-label">Vocabulary — Module ${String(m.id).padStart(2,'0')}</div>
      ${m.vocab.map(v => `
        <div class="vocab-bubble">
          <div class="term">${v.term}</div>
          <div class="def">${v.def}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function render(){
  renderSidebar();
  renderMain();
}

const GATE_CODE = "FNMPC2026"; // Demo access code — FNMPC would set and rotate this themselves.

function unlockGate(){
  document.getElementById('gateOverlay').style.display = 'none';
  document.getElementById('appRoot').style.display = 'flex';
  render();
}

function checkGateCode(){
  const input = document.getElementById('gateInput').value.trim();
  const errorEl = document.getElementById('gateError');
  if(input.toUpperCase() === GATE_CODE){
    try{ localStorage.setItem('crp-gate-unlocked', '1'); }catch(e){}
    unlockGate();
  } else {
    errorEl.textContent = "That code isn't correct. Please check with FNMPC and try again.";
    document.getElementById('gateInput').value = '';
    document.getElementById('gateInput').focus();
  }
}

(function initGate(){
  let alreadyUnlocked = false;
  try{ alreadyUnlocked = localStorage.getItem('crp-gate-unlocked') === '1'; }catch(e){}
  if(alreadyUnlocked){
    unlockGate();
  } else {
    const gi = document.getElementById('gateInput');
    gi.addEventListener('keypress', function(e){ if(e.key === 'Enter') checkGateCode(); });
    gi.focus();
  }
})();
</script>
</body>
</html>
